<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-badge">NC</span> NEON COAST <em>cover studio</em></div>
  <p class="tagline">Your photo + a caption → multi-panel Vice City cover art, exported as a PNG. Fully offline.</p>
  <button id="export-top" type="button" class="export-mini">Export PNG</button>
</header>
<main class="app">
  <aside class="controls">
    <section>
      <h2>Lettering</h2>
      <label>Title <input id="title" type="text" maxlength="26" value="NEON COAST"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="44" value="tales from the sunset strip"></label>
      <label>Ribbon <input id="ribbon" type="text" maxlength="52" value="ONE CITY • ONE SUMMER • NO BRAKES"></label>
    </section>
    <section>
      <h2>Layout</h2>
      <div id="layout-row" class="btn-row"></div>
    </section>
    <section>
      <h2>Colour grade</h2>
      <div id="grade-row" class="btn-row"></div>
    </section>
    <section>
      <h2>Panel art</h2>
      <p id="panel-label" class="panel-label">Panel 1</p>
      <div id="scene-row" class="btn-row"></div>
      <label class="file-label">Your photo <input id="photo" type="file" accept="image/*"></label>
      <label class="check-label"><input id="fill-all" type="checkbox"> Fill every panel with the photo</label>
      <div class="btn-row">
        <button id="fill-photo" type="button">Copy panel to all</button>
        <button id="reset-crop" type="button">Reset crop</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <label>Pan X <input id="panx" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <label>Pan Y <input id="pany" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <p class="hint">Tip: click a panel on the cover to select it, or drop a photo straight onto it.</p>
    </section>
    <section>
      <h2>Export</h2>
      <label>Post size
        <select id="size">
          <option value="1080x1080">Square 1080 × 1080</option>
          <option value="1080x1350" selected>Portrait 1080 × 1350</option>
          <option value="1920x1080">Wide 1920 × 1080</option>
          <option value="1080x1920">Story 1080 × 1920</option>
        </select>
      </label>
      <button id="export" type="button" class="export-btn">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </aside>
  <section class="stage">
    <canvas id="cover" width="1080" height="1350" aria-label="Your cover art"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
